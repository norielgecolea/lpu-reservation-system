services:

  reservation-postgres:
    image: postgres:17
    container_name: reservation-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lpu_reservation}
      # Keep DB clock UTC; app stores UTC wall times and UI shows Asia/Manila.
      TZ: UTC
      PGTZ: UTC

    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./data/postgres-data:/var/lib/postgresql/data
      - ./data/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Keep legacy hostname so existing WAR JDBC URLs (jdbc:...@postgres) still resolve.
    networks:
      default:
        aliases:
          - postgres

  reservation-tomcat:
    image: tomcat:11.0.22-jdk21
    container_name: reservation-tomcat
    environment:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
    ports:
      - "8080:8080"
    volumes:
      # Mount your local WAR files to deploy them automatically
      - ./data/tomcat/webapps:/usr/local/tomcat/webapps
      # Persistent logs on your host machine
      - ./data/tomcat/logs:/usr/local/tomcat/logs
    depends_on:
      reservation-postgres:
        condition: service_healthy

  reservation-angular:
    image: node:24-alpine
    container_name: reservation-angular

    working_dir: /app

    volumes:
      - ./frontend/frontend:/app
      - /app/node_modules

    # No host port needed — nginx serves the built files.
    # Keep optional host access to the build logs via `docker logs reservation-angular`.

    environment:
      BACKEND_URL: ${BACKEND_URL:-http://reservation-tomcat:8080}

    # Production build (not ng serve). --watch rebuilds on source changes.
    command: >-
      sh -c "npm install &&
      npx ng build --configuration=production &&
      npx ng build --configuration=production --watch"

    stdin_open: true
    tty: true

  reservation-web:
    image: nginx:latest
    container_name: reservation-web
    ports:
      - "80:80"
    volumes:
      - ./data/web/templates:/etc/nginx/templates
      - ./frontend/frontend/dist/frontend/browser:/usr/share/nginx/html:ro
    environment:
      NGINX_PORT: 80
      SERVER_NAME: localhost reservation.lpulaguna.com learnerreservation.lpulaguna.com
      TOMCAT_HOST: reservation-tomcat
      TOMCAT_PORT: 8080
    depends_on:
      - reservation-angular
      - reservation-tomcat

  reservation-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: reservation-cloudflared
    restart: unless-stopped

    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

    volumes:
      - ./data/cloudflared:/etc/cloudflared

    depends_on:
      - reservation-web
